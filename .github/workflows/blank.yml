name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project from zip (only if sources are inside an archive)
        run: |
          if ! find . -maxdepth 3 \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -not -path './.git/*' | grep -q .; then
            Z=./PyIDE_ready.zip
            [ -f "$Z" ] || Z=$(ls ./*.zip 2>/dev/null | head -1)
            if [ -z "$Z" ]; then
              echo "::error::No Gradle project and no zip archive found in the repository"
              exit 1
            fi
            echo "Unpacking $Z"
            unzip -o -q "$Z" -d _src
          fi

      - name: Locate Gradle project
        run: |
          ls -la
          S=$(find . -maxdepth 4 \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -not -path './.git/*' | head -1)
          if [ -z "$S" ]; then
            echo "::error::settings.gradle.kts not found. File tree:"
            find . -maxdepth 4 -not -path './.git/*' | sort | head -80
            exit 1
          fi
          DIR=$(cd "$(dirname "$S")" && pwd)
          echo "Gradle project: $DIR"
          rm -f "$DIR/local.properties"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11 (needed by Chaquopy at build time)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Point project to the SDK
        run: echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/local.properties"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PyIDE-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports if the build failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: ${{ env.PROJECT_DIR }}/app/build/reports
          if-no-files-found: ignore
